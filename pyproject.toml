[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-ttt"
version = "0.1.0"
description = "Core algorithms for test-time capability reuse in humanoid control"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]
